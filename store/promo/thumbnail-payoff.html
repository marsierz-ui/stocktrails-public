<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #161a26;
         font-family: "Segoe UI Black", "Arial Black", "Segoe UI", Arial, sans-serif; position: relative; }
  .glow { position: absolute; inset: 0;
          background: radial-gradient(900px 600px at 82% 30%, rgba(61,220,151,.22), transparent 60%),
                      radial-gradient(700px 500px at 0% 100%, rgba(80,100,170,.25), transparent 60%); }
  .grid { position: absolute; inset: 0;
          background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
          background-size: 100% 90px; }
  svg.chart { position: absolute; left: 0; top: 0; }
  .headline { position: absolute; left: 70px; top: 120px; color: #f2f5fb; font-size: 128px;
              line-height: .98; letter-spacing: -2px; text-transform: uppercase;
              text-shadow: 0 6px 24px rgba(0,0,0,.55); }
  .headline .g { color: #3ddc97; }
  .brand { position: absolute; left: 70px; top: 52px; display: flex; align-items: center; gap: 16px;
           color: #f2f5fb; font-size: 40px; letter-spacing: -.5px; }
  .brand svg { width: 56px; height: 56px; }
  .pills { position: absolute; left: 70px; bottom: 60px; display: flex; gap: 16px;
           font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 34px; }
  .pill { padding: 12px 28px; border-radius: 14px; background: rgba(255,255,255,.08); color: #9aa3b8;
          border: 2px solid rgba(255,255,255,.12); }
  .pill.pos { background: #3ddc97; color: #0f121b; border-color: #3ddc97; box-shadow: 0 0 30px rgba(61,220,151,.55); }
  .tag { position: absolute; right: 70px; bottom: 60px; font-family: "Segoe UI", Arial, sans-serif; font-weight: 700;
         font-size: 30px; color: #f2f5fb; display: flex; gap: 22px; align-items: center; }
  .tag i { display: inline-block; width: 38px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 10px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <svg class="chart" width="1280" height="720" viewBox="0 0 1280 720"><g transform="translate(1215 142) scale(.8) translate(-1215 -142)">
    <!-- market line -->
    <polyline points="610,560 700,500 780,530 880,430 960,470 1060,360 1140,400 1230,300"
              fill="none" stroke="#4a5578" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- your trail, tapering -->
    <g fill="none" stroke="#3ddc97" stroke-linecap="round" stroke-linejoin="round">
      <path d="M600 640 L720 520" stroke-width="64"/>
      <path d="M720 520 L780 575" stroke-width="50"/>
      <path d="M780 575 L900 420" stroke-width="38"/>
      <path d="M900 420 L950 462" stroke-width="28"/>
      <path d="M950 462 L1090 262" stroke-width="20"/>
      <path d="M1090 262 L1130 292" stroke-width="14"/>
      <path d="M1130 292 L1215 142" stroke-width="10"/>
    </g>
    <circle cx="1215" cy="142" r="30" fill="#f2f5fb"/>
    <circle cx="1215" cy="142" r="14" fill="#3ddc97"/>
  </g></svg>

  <div class="brand">
    <svg viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#0f121b"/>
      <g fill="none" stroke="#3ddc97" stroke-linecap="round" stroke-linejoin="round">
        <path d="M56 452 L150 350" stroke-width="44"/><path d="M150 350 L196 390" stroke-width="34"/>
        <path d="M196 390 L284 280" stroke-width="26"/><path d="M284 280 L322 310" stroke-width="18"/>
        <path d="M322 310 L440 150" stroke-width="12"/>
      </g>
      <circle cx="440" cy="150" r="17" fill="#f2f5fb"/><circle cx="440" cy="150" r="8" fill="#3ddc97"/>
    </svg>
    Stocktrails
  </div>

  <div class="headline">Does your<br>research<br><span class="g">pay off?</span></div>

  <div class="pills">
    <div class="pill pos">Positive</div>
    <div class="pill">Neutral</div>
    <div class="pill">Negative</div>
  </div>
  <div class="tag">
    <span><i style="background:#3ddc97"></i>You</span>
    <span><i style="background:#4a5578"></i>NASDAQ</span>
  </div>
</body>
</html>

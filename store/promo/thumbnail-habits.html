<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #161a26; position: relative;
         font-family: "Segoe UI", Arial, sans-serif; color: #f2f5fb; }
  .glow { position: absolute; inset: 0;
          background: radial-gradient(760px 520px at 88% -4%, rgba(61,220,151,.30), transparent 62%),
                      radial-gradient(620px 460px at 0% 104%, rgba(80,100,170,.30), transparent 62%); }
  .brand { position: absolute; left: 0; right: 0; top: 56px; display: flex; justify-content: center;
           align-items: center; gap: 18px; font-size: 52px; font-weight: 700; letter-spacing: -.5px; }
  .brand svg { width: 66px; height: 66px; }
  .headline { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 800;
              font-size: 118px; line-height: 1.02; letter-spacing: -2.5px; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .headline .g { color: #3ddc97; }
  #cal { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); display: grid;
         grid-auto-flow: column; grid-template-rows: repeat(7, 16px); gap: 5px; }
  #cal i { width: 16px; height: 16px; border-radius: 4px; display: block; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand">
    <svg viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#0f121b"/>
      <g fill="none" stroke="#3ddc97" stroke-linecap="round" stroke-linejoin="round">
        <path d="M56 452 L150 350" stroke-width="44"/><path d="M150 350 L196 390" stroke-width="34"/>
        <path d="M196 390 L284 280" stroke-width="26"/><path d="M284 280 L322 310" stroke-width="18"/>
        <path d="M322 310 L440 150" stroke-width="12"/>
      </g>
      <circle cx="440" cy="150" r="17" fill="#f2f5fb"/><circle cx="440" cy="150" r="8" fill="#3ddc97"/>
    </svg>
    Stocktrails
  </div>
  <div class="headline">Your research habits,<br><span class="g">measured.</span></div>
  <div id="cal"></div>
  <script>
    var s = 7, c = document.getElementById('cal'), h = '';
    function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 7 * 34; i++) {
      var col = Math.floor(i / 7), ramp = 0.25 + 0.75 * (col / 33), v = r() * ramp, a;
      if (v < .22) a = 0; else if (v < .4) a = .28; else if (v < .58) a = .5; else if (v < .76) a = .75; else a = 1;
      h += '<i style="background:' + (a ? 'rgba(61,220,151,' + a + ')' : 'rgba(255,255,255,.07)') + '"></i>';
    }
    c.innerHTML = h;
  </script>
</body>
</html>

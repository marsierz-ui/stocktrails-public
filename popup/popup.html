<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="head">
    <strong class="brand"><img class="brand-mark" src="../icons/brand/logo-48.svg" alt="" />Stocktrails</strong>
    <button id="open-dash" class="link">My Stocks &rarr;</button>
  </div>

  <div id="auth-gate" class="muted hidden" style="padding:10px 2px">Open <b>My Stocks</b> and sign in to start tracking your attention.</div>

  <div id="current" class="card">
    <div id="current-empty" class="muted">No stock detected on this page.</div>
    <div id="current-body" class="hidden">
      <div class="ticker"><span id="cur-ticker"></span> <span id="cur-badges" class="badges"></span></div>
      <div class="muted" id="cur-source"></div>
      <div class="sentiment">
        <span class="muted small">Expectation:</span>
        <button class="sent pos" data-s="positive">Positive</button>
        <button class="sent neu" data-s="neutral">Neutral</button>
        <button class="sent neg" data-s="negative">Negative</button>
      </div>
      <button id="log-now" class="full">Log without label</button>
      <!-- GROUP 5a/5b: optional fields, shown only once a sentiment is set -->
      <div id="extra" class="extra hidden">
        <label class="toggle"><input type="checkbox" id="pos-taken" /> Position taken</label>
        <div class="target">
          <label class="muted small" for="target-price">Target price</label>
          <input id="target-price" type="number" step="any" inputmode="decimal" placeholder="optional" />
        </div>
        <!-- GROUP 5c: optional horizon - by when the target should be reached -->
        <div class="target">
          <label class="muted small" for="horizon">Within</label>
          <select id="horizon">
            <option value="">no horizon</option>
            <option value="7">1 week</option>
            <option value="14">2 weeks</option>
            <option value="30">1 month</option>
            <option value="90">3 months</option>
            <option value="180">6 months</option>
            <option value="365">1 year</option>
          </select>
        </div>
        <div class="muted small" id="horizon-hint"></div>
        <div class="rationale">
          <label class="muted small" for="rationale">Rationale (optional)</label>
          <textarea id="rationale" rows="2" placeholder="Why? Your thesis, catalyst, risk..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="recent">
    <div class="muted small">Recent attention</div>
    <ul id="recent-list"></ul>
  </div>

  <script src="../src/config.js"></script>
  <script src="../src/portals.js"></script>
  <script src="../src/prices.js"></script>
  <script src="../src/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
